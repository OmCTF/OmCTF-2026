Alias "/public-hydrology" "/var/lib/vodokanal-public-hydrology/"
<Directory "/var/lib/vodokanal-public-hydrology/">
    AllowOverride None
    Options None
    Require all denied
    SetHandler 1c-application
    ManagedApplicationDescriptor "/var/lib/vodokanal-public-hydrology/default.vrd"
</Directory>

<LocationMatch "^/public-hydrology(?:/|$)">
    Require all denied
    RequestHeader unset Authorization
    RequestHeader unset Proxy-Authorization
    RequestHeader unset Cookie
    RequestHeader unset IBSession
    Header onsuccess unset Set-Cookie
    Header always unset Set-Cookie
    Header onsuccess unset WWW-Authenticate
    Header always unset WWW-Authenticate
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-store"
</LocationMatch>

<LocationMatch "^/public-hydrology/hs/hydrology/v1/(?:reference|posts|posts/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/series)$">
    AuthMerging Off
    Require expr "%{REQUEST_METHOD} == 'GET'"
    LimitRequestBody 1024
</LocationMatch>
