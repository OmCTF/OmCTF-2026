Alias "/public-dispatch" "/var/lib/vodokanal-public-dispatch/"
SetEnvIf Request_URI "^/public-dispatch(?:/|$)" vodokanal_guest_private=1
<Directory "/var/lib/vodokanal-public-dispatch/">
    AllowOverride None
    Options None
    Require all denied
    SetHandler 1c-application
    ManagedApplicationDescriptor "/var/lib/vodokanal-public-dispatch/default.vrd"
</Directory>
<LocationMatch "^/public-dispatch(?:/|$)">
    Require all denied
    SetEnv vodokanal_guest_private 1
    LogLevel crit
    RequestHeader unset Authorization
    RequestHeader unset Proxy-Authorization
    RequestHeader unset Cookie
    RequestHeader unset IBSession
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Real-IP
    RequestHeader unset X-Vodokanal-Source
    RequestHeader unset X-Vodokanal-Remote-Addr
    RequestHeader set X-Vodokanal-Remote-Addr "expr=%{CONN_REMOTE_ADDR}"
    Header onsuccess unset Set-Cookie
    Header always unset Set-Cookie
    Header onsuccess unset WWW-Authenticate
    Header always unset WWW-Authenticate
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-store"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
</LocationMatch>
<LocationMatch "^/public-dispatch/hs/dispatch/v1/(?:intakes|addresses|outages)$">
    AuthMerging Off
    Require expr "%{REQUEST_METHOD} == 'GET'"
    LimitRequestBody 1
</LocationMatch>
<LocationMatch "^/public-dispatch/hs/dispatch/v1/receipts/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$">
    AuthMerging Off
    Require expr "%{REQUEST_METHOD} == 'GET' && %{QUERY_STRING} == ''"
    LimitRequestBody 1
</LocationMatch>
<LocationMatch "^/public-dispatch/hs/dispatch/v1/hazard-reports$">
    AuthMerging Off
    Require expr "%{REQUEST_METHOD} == 'POST' && %{QUERY_STRING} == ''"
    LimitRequestBody 7340032
</LocationMatch>
