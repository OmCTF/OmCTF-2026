<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex home.html
    RedirectMatch 302 "^/login/$" "/login"
    RedirectMatch 302 "^/services/$" "/services"
    AliasMatch "^/login$" "/var/www/html/index.html"
    AliasMatch "^/services$" "/var/www/html/services.html"
    ErrorLog "|/usr/local/bin/sanitize-apache-error"
    CustomLog /proc/self/fd/1 vodokanal env=!vodokanal_guest_private
</VirtualHost>
