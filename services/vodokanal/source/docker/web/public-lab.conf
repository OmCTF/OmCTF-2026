Alias "/public" "/var/lib/vodokanal-public/"
<Directory "/var/lib/vodokanal-public/">
    AllowOverride None
    Options None
    Require all denied
    SetHandler 1c-application
    ManagedApplicationDescriptor "/var/lib/vodokanal-public/default.vrd"
</Directory>

<LocationMatch "^/public(?:/|$)">
    Require all denied
    RequestHeader unset Authorization
    RequestHeader unset Proxy-Authorization
    RequestHeader unset Cookie
    RequestHeader unset IBSession
    Header onsuccess unset Set-Cookie
    Header always unset Set-Cookie
    Header onsuccess unset WWW-Authenticate
    Header always unset WWW-Authenticate
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-store"
</LocationMatch>

<LocationMatch "^/public/hs/lab/v1/(?:reference|protocols|summary|samples/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/protocol(?:\.(?:csv|pdf))?)$">
    AuthMerging Off
    Require expr "%{REQUEST_METHOD} == 'GET'"
    LimitRequestBody 1024
</LocationMatch>
