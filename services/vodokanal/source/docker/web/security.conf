ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Header always edit Set-Cookie "^(ibsession=[^;]*)(.*)$" "$1$2; HttpOnly; SameSite=Lax"
Header edit Set-Cookie "^(ibsession=[^;]*)(.*)$" "$1$2; HttpOnly; SameSite=Lax"
Header always set Set-Cookie "ibsession=; Path=/vodokanal/; Max-Age=0; HttpOnly; SameSite=Lax" "expr=%{REQUEST_METHOD} == 'DELETE' && %{REQUEST_URI} == '/vodokanal/hs/api/v1/auth/session'"
Header always set Referrer-Policy "no-referrer"
Header onsuccess unset X-Content-Type-Options
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'"

<IfModule !unique_id_module>
    Error "The private API boundary requires mod_unique_id."
</IfModule>
<IfModule !lua_module>
    Error "The private native error filter requires mod_lua."
</IfModule>
<IfFile !/etc/apache2/vodokanal/private-native401.lua>
    Error "The private native error filter file is missing."
</IfFile>
<IfFile !/etc/apache2/vodokanal/private-native-session.lua>
    Error "The private native session filter file is missing."
</IfFile>
<IfFile !/etc/apache2/vodokanal/strict-json.lua>
    Error "The private native session parser file is missing."
</IfFile>
LuaPackagePath /etc/apache2/vodokanal/?.lua
LuaOutputFilter P0_NATIVE401 /etc/apache2/vodokanal/private-native401.lua private_native401
LuaOutputFilter P0_NATIVE_SESSION /etc/apache2/vodokanal/private-native-session.lua private_native_session
<LocationMatch "^/vodokanal/hs/api/v1(?:/|$)">
    RequestHeader set Accept application/json
    SetOutputFilter P0_NATIVE_SESSION;P0_NATIVE401
    Header onsuccess unset WWW-Authenticate
    Header always unset WWW-Authenticate
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "no-store"
    ErrorDocument 401 "{\"error\":{\"code\":\"кабинет_аутентификация_требуется\",\"message\":\"Войдите в кабинет заново.\"},\"requestId\":\"%{reqenv:UNIQUE_ID}\"}"
    Header always set X-Request-ID "expr=%{reqenv:UNIQUE_ID}" "expr=%{REQUEST_STATUS} == 401 && resp('X-API-Contract') != '1.0'"
    Header onsuccess unset Content-Type "expr=%{REQUEST_STATUS} == 401 && resp('X-API-Contract') != '1.0'"
    Header always set Content-Type "application/json; charset=utf-8" "expr=%{REQUEST_STATUS} == 401 && resp('X-API-Contract') != '1.0'"
    <If "req('Authorization') == '' && req('IBSession') == '' && req('Cookie') !~ /(?i)(^|;)[ \t]*ibsession=[^; \t]+/">
        Redirect 401
    </If>
</LocationMatch>

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html/vodokanal>
    LimitRequestBody 16384
</Directory>

<LocationMatch "^/vodokanal/hs/api/v1/(my|dispatch)/(requests/[0-9a-fA-F-]{36}/files|request-files/[0-9a-fA-F-]{36}/versions)$">
    LimitRequestBody 7340032
</LocationMatch>

<LocationMatch "^/vodokanal/hs/api/v1/(documents(?:/[0-9a-fA-F-]{36}/versions)?|meter-readings/[0-9a-fA-F-]{36}/photo)$">
    LimitRequestBody 7340032
</LocationMatch>

<LocationMatch "^/vodokanal/hs/api/v1/work/orders/[0-9a-fA-F-]{36}/photos$">
    LimitRequestBody 7340032
</LocationMatch>
<LocationMatch "^/vodokanal/hs/api/v1/work/orders/[0-9a-fA-F-]{36}/leader-actions/submit$">
    LimitRequestBody 65536
</LocationMatch>

<LocationMatch "^/vodokanal/hs/api/v1/lab/my/(orders|samples/[0-9a-fA-F-]{36}/private-conclusion)$">
    LimitRequestBody 65536
</LocationMatch>

ErrorLog "|/usr/local/bin/sanitize-apache-error"
ErrorLogFormat "%M"
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" vodokanal
CustomLog /proc/self/fd/1 vodokanal env=!vodokanal_guest_private
